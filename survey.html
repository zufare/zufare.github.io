<!DOCTYPE html>
<html>
<head>
  <title>Survey Kepuasan Pelanggan</title>
</head>

<body>

<h2 align="center">Survey Kepuasan Pelanggan</h2>

<form action="" method="post">

  <p>Nama: <input type="text" name="nama"></p>
  <p>Alamat: <input type="text" name="alamat"></p>
  <p>No Telepon: <input type="text" name="telp"></p>

  <p>Kategori Pelanggan:
    <select name="kategori">
      <option>Umum</option>
      <option>Pelajar</option>
      <option>Mahasiswa</option>
    </select>
  </p>

  <p>Produk yang disukai:</p>
  <input type="checkbox" name="produk" value="A"> Produk A<br>
  <input type="checkbox" name="produk" value="B"> Produk B<br>
  <input type="checkbox" name="produk" value="C"> Produk C<br>

  <p>Tingkat Kepuasan:</p>
  <input type="radio" name="kepuasan" value="puas"> Puas<br>
  <input type="radio" name="kepuasan" value="cukup"> Cukup<br>
  <input type="radio" name="kepuasan" value="tidak"> Tidak Puas<br>

  <p>Komentar:</p>
  <textarea rows="5" cols="30"></textarea>

  <br><br>
  <input type="submit" value="Submit">
  <input type="reset" value="Reset">

</form>

</body>
</html>
