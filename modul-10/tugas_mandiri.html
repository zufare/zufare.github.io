<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Mandiri Modul 10</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            text-align: center;
            padding-top: 100px;
            transition: 0.4s;
        }

        .dark-mode {
            background-color: #121212;
            color: white;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: royalblue;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1>Dark & Light Mode</h1>
    <p>Klik tombol di bawah untuk mengganti tema halaman.</p>

    <button id="toggleBtn">Aktifkan Dark Mode</button>

    <script>

        // Mengambil tombol
        const tombol = document.getElementById("toggleBtn");

        // Saat tombol diklik
        tombol.addEventListener("click", function () {

            // Cek apakah dark mode aktif
            if (document.body.classList.contains("dark-mode")) {

                // Kembali ke light mode
                document.body.classList.remove("dark-mode");
                tombol.textContent = "Aktifkan Dark Mode";

            } else {

                // Aktifkan dark mode
                document.body.classList.add("dark-mode");
                tombol.textContent = "Aktifkan Light Mode";
            }
        });

    </script>

</body>
</html>
