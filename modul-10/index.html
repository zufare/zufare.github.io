<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 1 - Dasar JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .container {
            border: 2px dashed #3498db;
            padding: 20px;
            display: inline-block;
            border-radius: 10px;
        }

        img {
            width: 250px;
            border-radius: 10px;
            margin: 15px 0;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="judul">Selamat Datang!</h2>

        <img id="gambar"
             src="https://picsum.photos/250/150"
             alt="gambar">

        <br>

        <button onclick="ubahKonten()">Ubah Konten</button>
    </div>

    <script>
        function ubahKonten() {
            document.getElementById("judul").textContent =
            "Konten Berhasil Diubah!";

            document.getElementById("gambar").src =
            "https://picsum.photos/250/151";
        }
    </script>

</body>
</html>
